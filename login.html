<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Inkwell account. Access your dashboard, manage your blog posts, and connect with readers.">
  <title>Sign In — Inkwell Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✦</text></svg>">
</head>
<body>
  <!-- Background Mesh -->
  <div class="bg-mesh"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">✦</div>
        <span>Inkwell</span>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="create.html" class="nav-link">Write</a>
      </div>

      <div class="nav-auth" id="navAuth">
        <a href="login.html" class="btn-ghost">Sign In</a>
        <a href="register.html" class="btn-primary-sm">Get Started</a>
      </div>

      <div class="nav-hamburger" id="navHamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Mobile Nav Overlay -->
  <div class="mobile-nav-overlay" id="mobileNav">
    <a href="index.html" class="nav-link">Home</a>
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="create.html" class="nav-link">Write</a>
    <div class="mobile-auth">
      <a href="login.html" class="btn btn-secondary">Sign In</a>
      <a href="register.html" class="btn btn-primary">Get Started</a>
    </div>
  </div>

  <!-- Login Page -->
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome back</h1>
          <p>Sign in to continue your journey</p>
        </div>

        <!-- Social Login -->
        <div class="auth-social">
          <button class="btn" id="socialGoogle" title="Sign in with Google" onclick="Toast.show('Social login is a demo feature', 'info')">
            G
          </button>
          <button class="btn" id="socialGithub" title="Sign in with GitHub" onclick="Toast.show('Social login is a demo feature', 'info')">
            ⌨
          </button>
          <button class="btn" id="socialTwitter" title="Sign in with Twitter" onclick="Toast.show('Social login is a demo feature', 'info')">
            𝕏
          </button>
        </div>

        <div class="auth-divider">or continue with email</div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">
              Password
              <a href="#" style="float:right; color:var(--primary-400); font-weight:500; font-size:0.8rem;" onclick="Toast.show('Password reset is a demo feature', 'info'); return false;">Forgot password?</a>
            </label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="password-toggle">👁</button>
            </div>
          </div>

          <div class="form-checkbox">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me for 30 days</label>
          </div>

          <button type="submit" class="btn btn-primary" id="loginSubmit" style="width:100%; margin-bottom: 4px;">
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create one free</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    // Login form handler
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      FormValidator.clearAllErrors(loginForm);

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      let isValid = true;

      // Validate email
      if (!FormValidator.validateEmail(email)) {
        FormValidator.showError(document.getElementById('loginEmail'), 'Please enter a valid email address.');
        isValid = false;
      }

      // Validate password
      if (!FormValidator.validateRequired(password)) {
        FormValidator.showError(document.getElementById('loginPassword'), 'Password is required.');
        isValid = false;
      }

      if (!isValid) return;

      // Attempt login
      const result = Auth.login(email, password);

      if (result.success) {
        Toast.show('Welcome back! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        Toast.show(result.message, 'error');
      }
    });

    // Clear errors on input
    loginForm.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('input', () => {
        FormValidator.clearError(input);
      });
    });
  </script>
</body>
</html>
